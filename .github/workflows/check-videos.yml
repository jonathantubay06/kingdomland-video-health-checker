name: Video Health Check

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      titles:
        description: 'JSON array of video titles to re-check (empty = check all)'
        required: false
        default: ''
        type: string

  # Scheduled auto-checks: 4x daily (Philippine Time = UTC+8)
  #   Midnight: 12 AM PHT = 16:00 UTC (previous day)
  #   Morning:   8 AM PHT =  0:00 UTC
  #   Lunch:    12 PM PHT =  4:00 UTC
  #   Night:     8 PM PHT = 12:00 UTC
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Restore previous data from data branch
        run: |
          git fetch origin data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            # Pull existing history and previous report for diff comparison
            git show origin/data:history.json > history.json 2>/dev/null || echo "[]" > history.json
            git show origin/data:uptime-log.json > uptime-log.json 2>/dev/null || echo "[]" > uptime-log.json
            git show origin/data:video-report.json > previous-report.json 2>/dev/null || true
          else
            echo "[]" > history.json
            echo "[]" > uptime-log.json
          fi

      - name: Run video check
        env:
          KL_USERNAME: ${{ secrets.KL_USERNAME }}
          KL_PASSWORD: ${{ secrets.KL_PASSWORD }}
          CHECK_TITLES: ${{ github.event.inputs.titles || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PERF_WARN_MS: ${{ vars.PERF_WARN_MS || '8000' }}
          PERF_CRIT_MS: ${{ vars.PERF_CRIT_MS || '15000' }}
        run: node check-videos.js

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ] && [ -f video-report.json ]; then
            PAYLOAD=$(node -e "const r=JSON.parse(require('fs').readFileSync('video-report.json','utf-8'));console.log(JSON.stringify({summary:r.summary,performanceAlerts:r.performanceAlerts||[],runId:'${{ github.run_id }}',repo:'${{ github.repository }}'}))")
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              || echo "Webhook notification failed (non-critical)"
          fi

      - name: Send daily summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ] && [ -f video-report.json ]; then
            node daily-summary.js || echo "Daily summary failed (non-critical)"
          fi

      - name: Push report to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fix remote URL to use token (persists through branch switches)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Save report files before switching branches
          mkdir -p /tmp/reports
          cp video-report.json /tmp/reports/ 2>/dev/null || true
          cp video-report.csv /tmp/reports/ 2>/dev/null || true
          cp failed-videos.txt /tmp/reports/ 2>/dev/null || true
          cp history.json /tmp/reports/ 2>/dev/null || true
          cp uptime-log.json /tmp/reports/ 2>/dev/null || true
          cp previous-report.json /tmp/reports/ 2>/dev/null || true

          # Create status metadata
          echo "{\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"runId\":\"${{ github.run_id }}\"}" > /tmp/reports/status.json

          # Guard rail (belt-and-suspenders): the data branch must NEVER contain
          # node_modules. Past bug -- `git add -A` below used to sweep up
          # node_modules (installed by `npm ci` earlier in this job) because the
          # orphan data branch has no .gitignore to exclude it. That silently
          # bloated the branch for 600+ commits until a push finally got too
          # large/slow and the runner lost communication with GitHub mid-push.
          echo "node_modules/" > /tmp/reports/.gitignore

          # Safety check: refuse to wipe the branch if this run produced no report.
          # check-videos.js failing/crashing should already fail its own step and skip
          # this one entirely (no `if: always()` here) -- but this is a second line of
          # defense so a future bug can never again wipe the last good report down to
          # an empty commit the way run 30310521189 did.
          if [ ! -s /tmp/reports/video-report.json ]; then
            echo "::error::video-report.json is missing or empty after the check run -- refusing to touch the data branch."
            exit 1
          fi

          # Switch to data branch (create if needed)
          git fetch origin data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git switch data
          else
            git checkout --orphan data
          fi

          # Clear the index too -- `git checkout --orphan` (and, on the branch's
          # very first fixed run, its still-bloated last commit) can leave files
          # staged that the working-tree wipe below won't touch on its own.
          git rm -rf --cached . > /dev/null 2>&1 || true

          # Wipe the working directory down to just .git, then restore ONLY the
          # saved report files. More reliable than the old `git rm -rf . || true`,
          # which only removed currently-TRACKED files and silently no-op'd on any
          # error -- leaving untracked leftovers (like node_modules) on disk to be
          # picked up by the git add that followed.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/reports/. .

          # Explicit file list (not `git add -A`) so it's always exactly clear
          # what ends up on this branch -- no ambiguity, no repeat of this bug.
          git add video-report.json video-report.csv failed-videos.txt status.json history.json uptime-log.json previous-report.json .gitignore 2>/dev/null || true
          git commit -m "Update video report $(date -u +%Y-%m-%d)" || echo "No changes"
          git push origin data
